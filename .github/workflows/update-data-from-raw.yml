name: Update public data from raw files

on:
  push:
    branches: [main]
    paths:
      - 'data/raw/**'
      - 'tools/build_data.py'
      - 'tools/validate_public_data.py'
      - '.github/workflows/update-data-from-raw.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-public-data-from-raw
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Show raw files
        run: |
          echo "Raw files committed to this branch:"
          find data/raw -type f \( -iname '*.csv' -o -iname '*.xml' -o -iname '*.zip' \) | sort || true

      - name: Rebuild public JSON
        run: python3 tools/build_data.py --input data/raw --output docs/data --verbose

      - name: Test Samurai rules
        run: python3 tools/test_samurai_rules.py

      - name: Validate public JSON
        run: python3 tools/validate_public_data.py

      - name: Commit generated data
        run: |
          if git diff --quiet -- docs/data; then
            echo "No generated data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "Update public data from raw files"
          git push
