name: Update public data from raw files

on:
  push:
    branches: [main]
    paths:
      - 'data/raw/**/*.csv'
      - 'data/raw/**/*.xml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Rebuild public JSON
        run: python3 tools/build_data.py --input data/raw --output docs/data

      - name: Test Samurai rules
        run: python3 tools/test_samurai_rules.py

      - name: Validate public JSON
        run: python3 tools/validate_public_data.py

      - name: Commit generated data
        run: |
          if git diff --quiet -- docs/data; then
            echo "No generated data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "Update public data from raw files"
          git push
