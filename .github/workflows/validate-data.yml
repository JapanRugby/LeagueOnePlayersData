name: Validate data

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'data/raw/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test Samurai rules
        run: python3 tools/test_samurai_rules.py
      - name: Validate public JSON
        run: python3 tools/validate_public_data.py
